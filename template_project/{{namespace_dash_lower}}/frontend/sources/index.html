<!doctype html>
<html lang="{{language_short}}">
  <head>

    <!-- Paramètres du navigateur. -->
    <meta charset="UTF-8" />
    <meta name="language" content="{{language_full}}" />
    <meta http-equiv="Content-Language" content="{{language_short}}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="" />

    <!--Informations pour le référencement. -->
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="author" content="{{creator_name}}" />

    <!-- Paramètres des cartes Open Graph et Meta. -->
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:image" content="" /> <!-- 1200x630 -->
    <meta property="og:url" content="" />
    <meta property="og:type" content="">
    <meta property="og:site_name" content="" />

    <!-- Paramètres des cartes Twitter. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="" />
    <meta name="twitter:description" content="" />
    <meta name="twitter:image" content="" />
    <meta name="twitter:creator" content="@" />
    <meta property="twitter:url" content="">
    <meta property="twitter:domain" content="">

    <!-- Paramètres de l'apparence de l'application. -->
    <title>{{namespace_dash_lower}}</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#000000" />

    <!-- Empêche les clignotements de chargement. -->
    <link rel="preload" href="" as="image">
    <style>body { background-color: black; }</style>

  </head>
  <body>

    <!-- Chargement de l'application. -->
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>

  </body>
</html>
